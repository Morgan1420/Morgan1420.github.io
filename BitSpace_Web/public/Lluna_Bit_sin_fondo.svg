  <g id="Accesorios">
    <!-- Rubor de Mejillas de Bits.jpeg (3 trazos oblicuos rosas suaves en cada mejilla) -->
    <g id="Rubor_Mejillas" fill="none" stroke="#F79EC2" stroke-width="5" stroke-linecap="round">
      <!-- Mejilla izquierda -->
      <line x1="126" y1="304" x2="133" y2="292" />
      <line x1="138" y1="307" x2="145" y2="294" />
      <line x1="150" y1="309" x2="157" y2="296" />
      <!-- Mejilla derecha -->
      <line x1="296" y1="316" x2="303" y2="304" />
      <line x1="308" y1="318" x2="315" y2="305" />
      <line x1="320" y1="320" x2="327" y2="307" />
    </g>

    <!-- Corona Real Dorada Apoyada Directamente Sobre la Cabeza (con separación limpia de la oreja derecha) -->
    <g id="Corona_Real">
      <path d="M 263 145
               L 276 92
               L 295 110
               L 324 87
               L 332 115
               L 355 108
               L 332 164
               Q 296 163, 263 145 Z"
            fill="#E3C31A" stroke="black" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="round" />

      <!-- Brillo lateral interior de la corona -->
      <path d="M 272 140 L 280 105" stroke="#F7E26B" stroke-width="3.5" stroke-linecap="round" />

      <!-- 3 Perlas rosas con contorno negro continuo en las puntas -->
      <g id="Perlas_Corona">
        <circle cx="275" cy="87" r="6.8" fill="#F49AC1" stroke="black" stroke-width="5" />
        <circle cx="325" cy="81" r="7.2" fill="#F49AC1" stroke="black" stroke-width="5" />
        <circle cx="358" cy="104" r="6.5" fill="#F49AC1" stroke="black" stroke-width="5" />
      </g>
    </g>

    <!-- Libro Azul Real de Tapa Dura en Perspectiva 3/4 Mirando Hacia el Bit -->
    <g id="Libro_Real" transform="translate(96, 336)">
      <!-- Sombra proyectada bajo el libro -->
      <ellipse cx="106" cy="148" rx="94" ry="11" fill="#000000" fill-opacity="0.20" />

      <!-- 1. Bloque de páginas blancas abiertas en abanico mirando hacia Bit -->
      <g id="Paginas_Abiertas_Libro">
        <!-- Abanico izquierdo de hojas blancas hacia Bit -->
        <path d="M 16 14
                 C 44 -1, 82 10, 110 44
                 L 100 49
                 L 13 18 Z"
              fill="#FFFFFF" stroke="black" stroke-width="5.8" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M 38 14 Q 74 19, 105 44" fill="none" stroke="black" stroke-width="2.6" stroke-linecap="round" />

        <!-- Abanico derecho de hojas blancas hacia Bit -->
        <path d="M 114 44
                 C 140 8, 168 0, 188 10
                 L 195 17
                 L 122 49 Z"
              fill="#FFFFFF" stroke="black" stroke-width="5.8" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M 119 44 Q 150 16, 188 14" fill="none" stroke="black" stroke-width="2.8" stroke-linecap="round" />
      </g>

      <!-- 2. Cubierta izquierda (contraportada en perspectiva 3/4 con líneas blancas onduladas) -->
      <g id="Contraportada_Izquierda">
        <path d="M 13 17
                 L 100 48
                 L 86 150
                 L 4 105 Z"
              fill="#04159E" stroke="black" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="round" />

        <!-- 5 líneas blancas caligráficas en perspectiva de Bits.jpeg -->
        <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 28 41 Q 36 39, 44 46 T 60 53 T 76 61" />
          <path d="M 24 55 Q 34 54, 44 61 T 64 69 T 80 76" />
          <path d="M 23 71 Q 35 71, 48 78 T 72 88" />
          <path d="M 31 87 Q 42 89, 54 96" />
          <path d="M 16 95 Q 28 95, 40 103 T 64 115" />
        </g>
      </g>

      <!-- 3. Lomo central rectangular de tapa dura -->
      <path id="Lomo_Central"
            d="M 100 48
               L 122 49
               L 109 151
               L 86 150 Z"
            fill="#031082" stroke="black" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="round" />

      <!-- 4. Cubierta derecha (portada en escorzo 3/4 con emblema burdeos y detalles dorados) -->
      <g id="Portada_Derecha">
        <path d="M 122 49
                 L 195 19
                 L 186 125
                 L 109 151 Z"
              fill="#04159E" stroke="black" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Arco blanco superior de portada -->
        <path d="M 146 51 Q 160 42, 174 39" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

        <!-- Emblema central burdeos sobre pedestal azul acero -->
        <path d="M 143 69
                 C 144 55, 168 48, 167 62
                 L 164 119
                 L 139 128 Z"
              fill="#680C0C" stroke="black" stroke-width="4.5" stroke-linejoin="round" />

        <!-- Pedestal inferior azul acero -->
        <polygon points="131,130 172,115 174,125 129,141"
                 fill="#6488B4" stroke="black" stroke-width="4.2" stroke-linejoin="round" />

        <!-- Cenefas caligráficas doradas de portada -->
        <g fill="none" stroke="#F5DF2E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 134 78 L 139 69 L 145 76 L 152 66 L 158 73 L 165 63 L 173 67" />
          <path d="M 148 93 L 153 86 L 157 92 L 161 85" />
          <path d="M 131 113 Q 137 106, 143 110 T 156 105 T 169 100 T 177 97" />
        </g>
      </g>
    </g>
  </g>
