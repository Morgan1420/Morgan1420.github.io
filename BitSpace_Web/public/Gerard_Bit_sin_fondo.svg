  <g id="Accesorios">
    <!-- Bombilla Flotante de Bits.jpeg -->
    <g id="Bombilla_Ideas">
      <circle cx="250" cy="50" r="38" fill="#FFF9C4" fill-opacity="0.45" />
      <path d="M 230 84 C 230 78, 222 68, 218 58 C 210 38, 222 16, 250 16 C 278 16, 290 38, 282 58 C 278 68, 270 78, 270 84 Z" fill="#FEFA8E" stroke="black" stroke-width="7" stroke-linejoin="round" />
      <path d="M 226 42 C 228 30, 238 24, 250 23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 240 82 L 243 64 L 247 56 L 250 62 L 253 56 L 257 64 L 260 82" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <g id="Casquillo_Roscado">
        <rect x="232" y="84" width="36" height="7" rx="3.5" fill="#CFD8DC" stroke="black" stroke-width="4.5" stroke-linejoin="round" />
        <rect x="234" y="91" width="32" height="7" rx="3.5" fill="#B0BEC5" stroke="black" stroke-width="4.5" stroke-linejoin="round" />
        <path d="M 242 98 L 258 98 C 258 103, 242 103, 242 98 Z" fill="#455A64" stroke="black" stroke-width="4" stroke-linejoin="round" />
      </g>
    </g>
    <!-- Portátil en Perspectiva Cónica de 2 Puntos (Mirando hacia Bit, mismo ancho de pantalla y teclado) -->
    <g id="Portatil_Gris" transform="translate(88, 340)">
      <!-- Sombra proyectada bajo el chasis -->
      <ellipse cx="128" cy="141" rx="122" ry="11" fill="#000000" fill-opacity="0.20" />

      <!-- 1. CHASIS INFERIOR Y TECLADO EN PERSPECTIVA (Mismo ancho que la pantalla, hacia Bit) -->
      <g id="Teclado_Base_Perspectiva">
        <!-- Silueta exterior unificada de la base completa (canto inferior + lateral derecho + plano superior) -->
        <path d="M 13 108
                 L 180 63
                 L 249 66
                 Q 260 67, 260 75
                 Q 260 80, 255 85
                 L 211 133
                 Q 203 141, 190 141
                 Q 102 143, 24 135
                 Q 12 133, 12.5 121 Z"
              fill="#BCBCBC" stroke="black" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Cara superior del deck del teclado (delimitada por el bisel lateral derecho hacia la bisagra) -->
        <path d="M 180 63
                 L 249 66
                 Q 257 67, 252 73
                 L 205 123
                 L 14 115 Z"
              fill="#CFCFCF" stroke="black" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Cavidad de teclas mirando hacia la pantalla oculta y hacia Bit -->
        <polygon points="185,74 236,76 200,113 165,112"
                 fill="#8D99A6" stroke="black" stroke-width="4.5" stroke-linejoin="round" />

        <!-- Filas y divisiones de teclas fugando hacia los dos puntos de fuga -->
        <g stroke="#263238" stroke-width="2.8" stroke-linecap="round">
          <line x1="180" y1="83" x2="227" y2="85" />
          <line x1="175" y1="93" x2="218" y2="94" />
          <line x1="170" y1="103" x2="209" y2="104" />
          <line x1="213" y1="75" x2="180" y2="112" />
        </g>
      </g>

      <!-- 2. TAPA TRASERA DE LA PANTALLA (Pantalla oculta mirando a Bit; igual ancho que la base) -->
      <g id="Tapa_Pantalla">
        <!-- Tapa con sutil fuga hacia la izquierda (arista derecha ligeramente más cercana por perspectiva) -->
        <path d="M 30 17
                 Q 112 11, 188 10
                 Q 204 10, 205 26
                 L 206 116
                 Q 206 124, 195 125
                 Q 104 127, 21 119
                 Q 13 118, 13 109
                 L 17 32
                 Q 18 18, 30 17 Z"
              fill="#D4D4D4" stroke="black" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Brillo limpio en el borde superior de la tapa -->
        <path d="M 32 24 Q 112 18, 187 17" stroke="#ECECEC" stroke-width="3.5" stroke-linecap="round" fill="none" />

        <!-- Emblema central (pera minimalista de Bits.jpeg en perspectiva sutil) -->
        <g id="Logo_Tapa" transform="translate(111, 69) skewY(-1.5)">
          <circle cx="-1" cy="-27" r="3.8" fill="black" />
          <path d="M -2 -18
                   C 3 -18, 5 -10, 6 -3
                   C 7 3, 15 5, 15 14
                   C 15 23, 7 27, -2 27
                   C -12 27, -18 21, -18 12
                   C -18 4, -11 -1, -8 -8
                   C -6 -13, -5 -18, -2 -18 Z"
                fill="black" />
        </g>
      </g>
    </g>
  </g>
</svg>